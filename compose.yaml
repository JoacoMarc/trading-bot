name: tradingbot

services:
  # Servicio base: `docker compose run --rm bot doctor`, `docker compose run --rm bot backtest ...`
  bot:
    build: .
    image: tradingbot:local
    # Solo para `docker compose run --rm bot ...` (run activa el perfil solo): así `up -d` de otro
    # perfil no levanta este contenedor auxiliar, que corre `--help` y termina.
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: UTC
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./experiments:/app/experiments
      - ./configs:/app/configs:ro
      # La DB va en volumen nombrado: SQLite sobre bind mount de Windows tiene problemas de locking.
      - tradingbot-db:/app/db

  # --- Perfiles de larga duración -----------------------------------------------------
  # Fase 7 (ADR-0011): `docker compose --profile paper up -d`; frenar con `tradingbot stop`
  # (archivo logs/STOP desde el host) y apagar con `docker compose --profile paper down`.
  # El healthcheck solo marca `unhealthy` (compose no reinicia por salud); el proceso tiene un
  # watchdog interno que sale con 1 si no completa un ciclo en 2 x timeframe + 5 min, y
  # `restart: unless-stopped` lo vuelve a levantar.
  paper:
    extends: bot
    profiles: ["paper"]
    command: ["paper", "--config", "configs/paper.yaml"]
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: ["CMD", "tradingbot", "status", "--check"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  # Fase 10:
  # testnet:
  #   extends: bot
  #   profiles: ["testnet"]
  #   env_file: [.env.testnet]
  #   command: ["live", "--config", "configs/testnet.yaml"]
  #   restart: unless-stopped
  #
  # live:
  #   extends: bot
  #   profiles: ["live"]
  #   env_file: [.env.live]          # único lugar donde viven las claves con permiso de trading
  #   command: ["live", "--config", "configs/live.yaml", "--confirm-live"]
  #   restart: unless-stopped

volumes:
  tradingbot-db:
