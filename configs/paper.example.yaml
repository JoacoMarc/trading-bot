# Paper trading de regime_bh (ADR-0011): precios en vivo de Binance, órdenes simuladas, misma
# config que WF-0008 / EXP-0010 (λ 0.5). Copiar a configs/paper.yaml y lanzar con
# `docker compose --profile paper up -d`. Sin secretos acá: el paper no necesita claves.
# Mientras el Gate 1 de regime_bh no cierre (ROADMAP, Fase 7), estas semanas no cuentan para el Gate 2.

mode: paper

strategy:
  name: regime_bh
  timeframe: 4h
  pairs: [BTC/USDT]
  params:
    sma_days: 200
    momentum_days: 30
    stop_pct: 0.20
    bars_per_day: 6

risk:
  sizing_mode: fraction
  position_fraction: 0.5      # λ final (WF-0008)
  max_positions: 1
  max_exposure_pct: 1.0
  daily_loss_limit_pct: 0.03  # inerte en esta estrategia (decide al cierre del día); queda como red
  max_drawdown_pct: 0.20      # circuit breaker: reanuda por plazo (30 d, misma regla que el WF)
  drawdown_pause_days: 30     # o antes a mano con `tradingbot resume --breaker`
  kill_switch_file: logs/STOP # bind mount: el host escribe, el contenedor lo ve (RESUME al lado)
  # Sin market_filter: el régimen lo trae la propia estrategia (en backtest solo servía para el
  # benchmark B&H filtrado).

execution:
  fee_rate: 0.001
  pay_with_bnb: false
  slippage_bps: 5
  stop_watch_interval_s: 60   # el StopWatcher revisa el último precio cada 60 s

exchange:
  recv_window_ms: 10000
  request_timeout_ms: 10000

backtest:
  initial_cash: 10000         # saldo simulado inicial del paper

notify:                       # ADR-0012; runbook docs/runbooks/paper.md ("Telegram")
  timezone: America/Argentina/Buenos_Aires   # solo para mostrar horas y para el resumen diario
  telegram_enabled: false     # true requiere TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID en el .env
  daily_summary_hour: 9       # hora local del resumen diario (/daily lo pide a demanda)
  confirm_window_s: 60        # segundos para confirmar `/stop flatten` con `si`
  events:                     # nivel por categoria: "on" (con sonido) | "silent" | "off"
    entry: "on"               # posicion abierta
    exit: "on"                # trade cerrado por senal, flatten o riesgo
    stop: "on"                # trade cerrado por stop o trailing
    stuck: "on"               # salida trabada por filtros del exchange
    protection: "on"          # circuit breaker, perdida diaria, kill switch, filtro de mercado
    rejection: "silent"       # entrada rechazada por riesgo o por el broker
    feed: "silent"            # velas tardias o huecos (los reintentos solo van al log)
    error: "on"               # tareas caidas, watchdog
    lifecycle: "on"           # arranque, parada, reanudacion
    daily: "on"               # resumen diario

persistence:
  db_dir: db                  # paper.db (volumen nombrado en Docker)
  logs_dir: logs              # status.json y STOP
