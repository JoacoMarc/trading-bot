# En evaluación histórica. No habilitado para paper.
mode: backtest
strategy:
  name: donchian
  timeframe: 4h
  pairs:
  - BTC/USDT
  - ETH/USDT
  - BNB/USDT
  - XRP/USDT
  - ADA/USDT
  - LTC/USDT
  - LINK/USDT
  - SOL/USDT
