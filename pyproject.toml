[project]
name = "tradingbot"
version = "0.1.0"
description = "Bot de trading propio para Binance Spot: backtest, paper y live con un solo motor."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Joaquín Marcoff" }]
dependencies = [
  "ccxt>=4.5,<5",
  "pandas>=3.0,<3.1",
  "numpy>=2.0,<3",
  "pyarrow>=19,<26",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.40,<2.1",
  "optuna>=5.0,<6",
  "typer>=0.20,<1",
  "structlog>=25,<27",
  "python-telegram-bot[job-queue,rate-limiter]>=22,<23",
  "anthropic>=1.0,<2",
  "matplotlib>=3.9,<4",
]

[project.scripts]
tradingbot = "tradingbot.cli.app:main"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.130",
  "pre-commit>=4.0",
]
# Solo para generar fixtures de referencia de indicadores (Fase 3). No va a Docker.
fixtures = ["ta-lib>=0.6"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # reglas propias de ruff
  "PT",       # estilo pytest
  "ANN",      # anotaciones de tipo
  "T20",      # sin print() (usar typer.echo / logging)
  "DTZ",      # datetimes siempre tz-aware
  "PLE",      # errores de pylint
]
ignore = [
  "ANN401",                       # Any explícito permitido en fronteras (ccxt)
  "RUF001", "RUF002", "RUF003",   # tildes y caracteres no ASCII en textos en español
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PT011"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tradingbot"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "pyarrow.*", "optuna.*", "telegram.*", "talib.*", "matplotlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not testnet' -q"
markers = [
  "network: requiere acceso a Binance (endpoints públicos, sin claves)",
  "testnet: requiere claves de Binance Spot Testnet",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["tradingbot"]
branch = true
