repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        # Artefactos reproducibles con hashes: curvas WF y dataset/features ML (10–13 MB cada uno).
        exclude: '^experiments/runs/(.*/equity\.csv|RES-[0-9]+-ml-dataset/(dataset|features)\.parquet)$'
        args: [--maxkb=2000]
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
