name: tradingbot-candidates

x-candidate: &candidate
  image: ${CANDIDATE_IMAGE:?Definir imagen validada por revision}
  restart: unless-stopped
  stop_grace_period: 60s
  environment:
    TZ: UTC
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Falta token de Telegram}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Falta chat de Telegram}
    TRADINGBOT_NOTIFY__TELEGRAM_RECEIVE_COMMANDS: "false"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
  healthcheck:
    test: ["CMD", "tradingbot", "status", "--check"]
    interval: 60s
    timeout: 10s
    start_period: 120s
    retries: 3

services:
  pullback:
    <<: *candidate
    profiles: [pullback]
    command: ["paper", "--config", "configs/candidates/paper-pullback_rsi.yaml"]
    volumes:
      - ./configs:/app/configs:ro
      - ./logs/candidates/pullback:/app/logs
      - pullback-db:/app/db
  donchian:
    <<: *candidate
    profiles: [donchian]
    command: ["paper", "--config", "configs/candidates/paper-donchian.yaml"]
    volumes:
      - ./configs:/app/configs:ro
      - ./logs/candidates/donchian:/app/logs
      - donchian-db:/app/db

volumes:
  pullback-db:
  donchian-db:
